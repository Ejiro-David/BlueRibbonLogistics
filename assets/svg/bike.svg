<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="840" height="560">
  <!-- wheels -->
  <g class="wheel" id="wr">
    <circle cx="110" cy="212" r="50" fill="#13313F"/>
    <circle cx="110" cy="212" r="45" fill="none" stroke="#0A222C" stroke-width="5" stroke-dasharray="7 9"/>
    <circle cx="110" cy="212" r="34" fill="#E9F1F4"/>
    <g stroke="#1B4557" stroke-width="3.5" stroke-linecap="round">
      <line x1="110" y1="180" x2="110" y2="244"/>
      <line x1="82.3" y1="196" x2="137.7" y2="228"/>
      <line x1="82.3" y1="228" x2="137.7" y2="196"/>
    </g>
    <circle cx="110" cy="212" r="10" fill="#1B4557"/>
    <circle cx="110" cy="212" r="4" fill="#F98715"/>
  </g>
  <g class="wheel" id="wf">
    <circle cx="322" cy="212" r="50" fill="#13313F"/>
    <circle cx="322" cy="212" r="45" fill="none" stroke="#0A222C" stroke-width="5" stroke-dasharray="7 9"/>
    <circle cx="322" cy="212" r="34" fill="#E9F1F4"/>
    <g stroke="#1B4557" stroke-width="3.5" stroke-linecap="round">
      <line x1="322" y1="180" x2="322" y2="244"/>
      <line x1="294.3" y1="196" x2="349.7" y2="228"/>
      <line x1="294.3" y1="228" x2="349.7" y2="196"/>
    </g>
    <circle cx="322" cy="212" r="10" fill="#1B4557"/>
    <circle cx="322" cy="212" r="4" fill="#F98715"/>
  </g>
  <!-- frame, swingarm, chain guard -->
  <line x1="110" y1="212" x2="212" y2="200" stroke="#1B4557" stroke-width="11" stroke-linecap="round"/>
  <rect x="128" y="192" width="80" height="14" rx="7" fill="#0F2B38" transform="rotate(-6 168 199)"/>
  <path d="M290 116 L222 186" stroke="#1B4557" stroke-width="13" stroke-linecap="round"/>
  <!-- engine -->
  <path d="M186 168 L246 164 Q256 164 256 175 L252 204 Q250 213 240 213 L196 213 Q186 213 186 203 Z" fill="#9DB0B8"/>
  <g stroke="#7F949D" stroke-width="3" stroke-linecap="round">
    <line x1="198" y1="176" x2="244" y2="174"/><line x1="198" y1="186" x2="244" y2="184"/><line x1="198" y1="196" x2="242" y2="194"/>
  </g>
  <!-- exhaust -->
  <path d="M236 206 Q226 228 176 228 L104 226" fill="none" stroke="#C9D5DA" stroke-width="9" stroke-linecap="round"/>
  <rect x="52" y="214" width="80" height="20" rx="10" fill="#B8C7CD"/>
  <rect x="48" y="216" width="14" height="16" rx="6" fill="#8EA2AA"/>
  <circle class="exhaust-tip" cx="50" cy="224" r="1" fill="none"/>
  <!-- tail -->
  <path d="M58 154 Q92 138 152 144 L152 160 Q104 158 66 170 Z" fill="#1B4557"/>
  <rect x="50" y="152" width="14" height="9" rx="4" fill="#F98715"/>
